  <rect x="40" y="40" width="432" height="432" rx="84" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>
  <path d="M122 132 L220 204 L122 276" stroke="#F3F4F6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="244" y="252" width="116" height="36" rx="18" fill="#F3F4F6"/>
